<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPADA UPNYK Assignment Scanner</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1>SPADA Scanner</h1>
        <p id="meta-line" class="meta">Belum pernah dipindai</p>
      </div>
      <button id="btn-options" type="button" class="icon-btn" aria-label="Pengaturan" title="Pengaturan &amp; Info Extension ID">⚙️</button>
    </header>

    <section id="setup-banner" class="setup-banner hidden">
      <span id="setup-banner-text">Setup belum selesai</span>
      <button id="btn-setup-guide" type="button" class="link-btn">Panduan Setup</button>
    </section>

    <section id="alert-box" class="alert hidden" role="alert"></section>

    <section class="actions">
      <button id="btn-scan" type="button" class="btn btn-primary">🔍 Scan SPADA</button>
      <button id="btn-sync" type="button" class="btn btn-secondary">📅 Sync ke Calendar</button>
    </section>
    <p id="sync-preview-hint" class="preview-hint">Belum ada hasil scan</p>

    <section class="filter-bar" aria-label="Filter tampilan daftar tugas">
      <div class="filter-field">
        <label for="filter-course" class="sr-only">Filter mata kuliah</label>
        <select id="filter-course" class="filter-select" aria-label="Filter mata kuliah">
          <option value="all">Semua mata kuliah</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="filter-time" class="sr-only">Filter waktu tenggat</label>
        <select id="filter-time" class="filter-select" aria-label="Filter waktu tenggat">
          <option value="all">Semua waktu</option>
          <option value="upcoming">Mendatang</option>
          <option value="overdue">Sudah lewat</option>
        </select>
      </div>
    </section>

    <section class="tabs" role="tablist" aria-label="Filter status pengumpulan">
      <button id="tab-pending" type="button" class="tab active" role="tab" aria-selected="true">Belum (<span id="count-pending">0</span>)</button>
      <button id="tab-submitted" type="button" class="tab" role="tab" aria-selected="false">Terkirim (<span id="count-submitted">0</span>)</button>
      <button id="tab-all" type="button" class="tab" role="tab" aria-selected="false">Semua (<span id="count-all">0</span>)</button>
    </section>

    <main id="assignment-list" class="list"></main>

    <footer class="footer">
      <span id="sync-status">Google Calendar: belum terhubung</span>
      <button id="btn-connect" type="button" class="link-btn">Hubungkan</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
